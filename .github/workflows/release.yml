name: release

# 打一个 tag 就产出一个免安装 Windows 包，挂到 GitHub Release 上：
#   git tag v0.1.0 && git push origin v0.1.0
# 也可以在 Actions 页面手动跑（workflow_dispatch），只上传 artifact 不发 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "包版本号（不带 v）"
        default: "0.1.0"

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile || pnpm install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate the CPython directory to bundle
        id: python-dir
        shell: bash
        run: echo "path=$(python -c 'import sys; print(sys.base_prefix)')" >> "$GITHUB_OUTPUT"

      - name: Build portable zip
        env:
          PYTHONIOENCODING: utf-8
        run: >-
          python scripts/package_windows.py
          --version "${{ steps.version.outputs.value }}"
          --python-dir "${{ steps.python-dir.outputs.path }}"

      - uses: actions/upload-artifact@v4
        with:
          name: CulturalWalk-windows-x64
          path: release/*.zip
          if-no-files-found: error

  github-release:
    needs: windows-zip
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CulturalWalk-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            免安装 Windows 版：下载下面的 zip，解压后双击 `start.bat`，
            浏览器打开 http://127.0.0.1:8000 即可（首次启动自动建库并灌演示数据）。

            演示账号（密码都是 `Demo12345!`）：
            - demo@demo.local：普通用户
            - editor@demo.local：投稿/创作
            - reviewer@demo.local：审核/发布

            不需要安装 Python、Node 或数据库。
